name: Release Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Model-independent tests
        run: cargo test --locked --all-targets
      - name: Prepare pinned native runtime
        run: python scripts/setup_runtime.py
      - name: Native integration tests
        run: cargo test --locked --test native_engine -- --ignored
      - name: Build portable release
        run: python scripts/package.py --skip-downloads --release
      - name: Verify portable release
        run: |
          $archive = Get-ChildItem -LiteralPath dist -Filter 'Whistle-*-windows-x64.zip'
          if ($archive.Count -ne 1) { throw 'Expected exactly one Windows archive' }
          python scripts/verify_package.py $archive.FullName --expect-version $env:RELEASE_TAG --expect-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve verified release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release
          path: |
            dist/Whistle-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = Join-Path releases "$($env:RELEASE_TAG).md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          $assets = @((Get-ChildItem -LiteralPath dist -Filter 'Whistle-*-windows-x64.zip').FullName, (Join-Path (Get-Location) 'dist/SHA256SUMS.txt'))
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'This release is already public; refusing to replace assets' }
            gh release edit $env:RELEASE_TAG --title "Whistle Desktop $($env:RELEASE_TAG)" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --draft --verify-tag --title "Whistle Desktop $($env:RELEASE_TAG)" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
