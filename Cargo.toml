[package]
name = "whistle-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Private, native, offline speech to text with Whistle"
license = "MIT"
repository = "https://github.com/Prit36/whistle-desktop"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", rev = "b3cb8d04a75c2212aed4e9f950f0e0fdd5208a39" }
fastframe-text = { git = "https://github.com/crmne/fastframe", rev = "b3cb8d04a75c2212aed4e9f950f0e0fdd5208a39" }
fastframe-file = { git = "https://github.com/crmne/fastframe", rev = "b3cb8d04a75c2212aed4e9f950f0e0fdd5208a39" }
libloading = "0.9.0"
memmap2 = "0.9"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
rtrb = "0.4.0"
rubato = "5.0.1"
audioadapter-buffers = "5.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis", "isomp4", "aac"] }

[dev-dependencies]
hound = "3.5.1"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[patch.crates-io]
ecolor = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
eframe = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
emath = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
winit = { git = "https://github.com/crmne/winit", rev = "ed7caa9023f10b397f5b6ec8284a840cbd8a6f65" }
